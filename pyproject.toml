[project]
name = "churn-mlops"
version = "1.0.0"
description = "Pipeline de MLOps com monitoramento de data drift e retreinamento automático para classificação de churn (Telco Customer Churn)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "scipy>=1.11,<2",
    "mlflow>=2.14,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "evidently>=0.4.33,<0.8",
    "streamlit>=1.33,<2",
    "plotly>=5.20,<7",
    "matplotlib>=3.8,<4",
    "pyyaml>=6,<7",
    "joblib>=1.3,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Engine de dados sintéticos da especificação original. O engine interno
# (Gaussian copula em scipy) é o default por ser ~2 GB mais leve — ver ADR-0003.
sdv = ["sdv>=1.12,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
